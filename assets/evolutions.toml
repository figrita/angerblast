# evolutions.toml - the weapon x trifecta evolution matrix.
# [mods.<trifecta>] = the shared stat/behaviour preset for that trifecta column.
# [[row]] per weapon (WeaponId order) = 12 {name, desc} for that weapon's evolutions.
# special: none explode beam swarm rapid pierceall burn shotgun rail storm voidpull prism chaos
# on_kill: none magnet chain shield bounty frag reignite
# on_hit_effect/aura_effect: none slow burn poison freeze shock weaken mark goo

